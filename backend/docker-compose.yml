version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: eventhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eventhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: eventhub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: eventhub_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/eventhub?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_super_secret_key_here
      RESEND_API_KEY: re_NRJQUj9n_Euh2ntNjDE1hpGnYWor3XnNh
      NODE_ENV: development
      PORT: 3001
    # Mount for live code reload (optional, for development only)
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules

volumes:
  postgres_data: